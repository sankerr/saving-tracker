name: Daily sync

on:
  schedule:
    - cron: '5 5 * * *'   # 08:05 Asia/Jerusalem (UTC+3)
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send the new-yield email if a new monthly yield is published'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preflight secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "ERROR: GitHub secret CRON_SECRET is not set."
            exit 1
          fi
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "ERROR: GitHub secret API_URL is not set."
            exit 1
          fi
          echo "CRON_SECRET is set (${#CRON_SECRET} chars)"
          echo "API_URL=${{ secrets.API_URL }}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Wake API and trigger sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ secrets.API_URL }}
          # Scheduled runs always send; manual runs honor the send_email input.
          SEND_EMAIL: ${{ github.event.inputs.send_email == 'false' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          BASE="${API_URL%/}"
          if [ "${SEND_EMAIL}" = "false" ]; then
            EMAIL_QS="0"
          else
            EMAIL_QS="1"
          fi
          echo "send_email=${SEND_EMAIL} (email query = ${EMAIL_QS})"

          echo "== Health check =="
          HEALTH_CODE=$(curl -sS -o /tmp/health.txt -w '%{http_code}' \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            "${BASE}/api/health" || true)
          echo "GET /api/health -> HTTP ${HEALTH_CODE}"
          cat /tmp/health.txt || true
          echo

          if [ "${HEALTH_CODE}" != "200" ]; then
            echo "ERROR: API health check failed (expected 200)."
            exit 1
          fi

          echo "== Trigger cron sync (runs inline, up to ~5 min) =="
          SYNC_CODE=$(curl -sS -o /tmp/cron-sync.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --connect-timeout 30 --max-time 600 \
            "${BASE}/api/cron/sync?email=${EMAIL_QS}" || true)
          echo "POST /api/cron/sync -> HTTP ${SYNC_CODE}"
          cat /tmp/cron-sync.txt || true
          echo

          case "${SYNC_CODE}" in
            200)
              echo "Cron sync finished."
              ;;
            401)
              echo "ERROR: Unauthorized — CRON_SECRET on Vercel does not match GitHub secret."
              exit 1
              ;;
            503)
              echo "ERROR: Cron not configured — set CRON_SECRET on Vercel and redeploy."
              exit 1
              ;;
            409)
              echo "ERROR: Cron sync already running."
              exit 1
              ;;
            *)
              echo "ERROR: Unexpected HTTP ${SYNC_CODE} from /api/cron/sync."
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path("/tmp/cron-sync.txt").read_text())
          if not data.get("ok"):
              print(f"ERROR: cron sync failed: {data.get('error')}", file=sys.stderr)
              sys.exit(1)
          results = (data.get("results") or {}).get("users") or []
          failed_notify = False
          for row in results:
              print(
                  f"user_id={row.get('user_id')} "
                  f"before={row.get('before')} after={row.get('after')} "
                  f"new_yield={row.get('new_yield')} "
                  f"notified={row.get('notified')} "
                  f"email_skipped={row.get('email_skipped')} "
                  f"notify_error={row.get('notify_error')} "
                  f"sync_error={row.get('sync_error')}"
              )
              if row.get("sync_error"):
                  print(f"ERROR: sync failed for user_id={row.get('user_id')}: {row.get('sync_error')}", file=sys.stderr)
                  sys.exit(1)
              # Only a real send attempt that errored is a failure. Skipped
              # emails (no new yield / email disabled) are expected and fine.
              if row.get("notify_error"):
                  failed_notify = True
                  print(f"ERROR: notify failed for user_id={row.get('user_id')}: {row.get('notify_error')}", file=sys.stderr)
          if not results:
              print("WARN: no approved users synced.")
          if failed_notify:
              sys.exit(1)
          PY
