name: backend-ci

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main, feat/react-frontend-rewrite]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Health check against local SQLite
        env:
          DATABASE_URL: sqlite:////tmp/saving-tracker-ci.db
          SESSION_SECRET: ci-test-secret-not-for-production
          NO_BROWSER: '1'
          PORT: '8000'
          ADMIN_USERNAME: ci@example.com
          ADMIN_PASSWORD: ci-password-12345678
        run: |
          set -euo pipefail
          python saving_tracker.py &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/api/health" >/tmp/health.json; then
              echo "health ok after ${i}s"
              cat /tmp/health.json
              echo
              curl -fsS "http://127.0.0.1:8000/api/version"
              echo
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: server did not become healthy"
          exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t saving-tracker-api ./backend
